    <script>
      (function () {
        if (window.__velvetSpeakEvenAppMessageBootstrapInstalled) return;
        window.__velvetSpeakEvenAppMessageBootstrapInstalled = true;
        var delegate = typeof window._listenEvenAppMessage === "function"
          ? window._listenEvenAppMessage.bind(window)
          : null;
        function isRecord(value) {
          return value && typeof value === "object";
        }
        function route(message) {
          if (!isRecord(message)) return;
          if (message.method === "evenHubEvent") {
            var data = isRecord(message.data) && "jsonData" in message.data ? message.data.jsonData : message.data;
            window.dispatchEvent(new CustomEvent("evenHubEvent", { detail: data }));
            return;
          }
          if (message.method === "deviceStatusChanged") {
            window.dispatchEvent(new CustomEvent("deviceStatusChanged", { detail: message.data }));
            return;
          }
          if (message.method === "evenAppLaunchSource") {
            window.dispatchEvent(new CustomEvent("evenAppLaunchSource", { detail: message.data }));
          }
        }
        function listener(message) {
          if (delegate) return delegate(message);
          route(message);
        }
        Object.defineProperty(window, "_listenEvenAppMessage", {
          configurable: true,
          get: function () {
            return listener;
          },
          set: function (next) {
            delegate = typeof next === "function" ? next.bind(window) : null;
          }
        });
      }());
    </script>
