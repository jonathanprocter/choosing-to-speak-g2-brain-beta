    <script>
      (function () {
        if (window.__velvetSpeakEvenAppMessageBootstrapInstalled) return;
        window.__velvetSpeakEvenAppMessageBootstrapInstalled = true;
        var delegate = typeof window._listenEvenAppMessage === "function"
          ? window._listenEvenAppMessage.bind(window)
          : null;
        function isRecord(value) {
          return value && typeof value === "object";
        }
        function route(message) {
          if (!isRecord(message)) return;
          if (message.method === "evenHubEvent") {
            var data = isRecord(message.data) && "jsonData" in message.data ? message.data.jsonData : message.data;
            window.dispatchEvent(new CustomEvent("evenHubEvent", { detail: data }));
            return;
          }
          if (message.method === "deviceStatusChanged") {
            window.dispatchEvent(new CustomEvent("deviceStatusChanged", { detail: message.data }));
            return;
          }
          if (message.method === "evenAppLaunchSource") {
            window.dispatchEvent(new CustomEvent("evenAppLaunchSource", { detail: message.data }));
          }
        }
        function listener(message) {
          if (delegate) return delegate(message);
          route(message);
        }
        Object.defineProperty(window, "_listenEvenAppMessage", {
          configurable: true,
          get: function () {
            return listener;
          },
          set: function (next) {
            delegate = typeof next === "function" ? next.bind(window) : null;
          }
        });
      }());
    </script>
    <script>
      (function () {
        if (window.__choosingToSpeakTouchBridgeInstalled) return;
        window.__choosingToSpeakTouchBridgeInstalled = true;
        var start = null;
        function closestAction(target) {
          return target && target.closest
            ? target.closest('button:not([disabled]), a[href], [role="button"], [role="tab"]')
            : null;
        }
        document.addEventListener("touchstart", function (event) {
          var touch = event.changedTouches && event.changedTouches[0];
          start = touch ? { x: touch.clientX, y: touch.clientY } : null;
        }, true);
        document.addEventListener("touchend", function (event) {
          var touch = event.changedTouches && event.changedTouches[0];
          if (!touch || !start) return;
          if (Math.abs(touch.clientX - start.x) > 12 || Math.abs(touch.clientY - start.y) > 12) return;
          var target = event.target;
          if (target && target.closest && target.closest("input, select, textarea, label")) return;
          var action = closestAction(target);
          if (!action) return;
          event.preventDefault();
          event.stopPropagation();
          window.setTimeout(function () {
            action.click();
          }, 0);
        }, true);
        var attempts = 0;
        function autoStartLive() {
          if (document.querySelector(".live-session-screen")) return;
          var button = document.querySelector(".live-start-button");
          if (button && !button.disabled && /start live/i.test(button.textContent || "")) {
            button.click();
            return;
          }
          attempts += 1;
          if (attempts < 8) window.setTimeout(autoStartLive, 900);
        }
        window.setTimeout(autoStartLive, 1800);
      }());
    </script>
